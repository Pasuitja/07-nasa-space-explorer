<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>NASA Space Explorer</title>
  <!-- Public Sans is the font used in NASA's web design system -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link href="style.css" rel="stylesheet" type="text/css" />
</head>
<body>
  <div class="container">
    <header class="site-header">
      <img src="img/nasa-worm-logo.png" alt="NASA Logo" class="logo" />
      <h1>Space Explorer</h1>
    </header>

    <!-- Random space fact (LevelUp) -->
    <section class="space-fact" aria-label="Space fact">
      <span class="fact-label">🚀 Did You Know?</span>
      <p id="spaceFact"></p>
    </section>

    <div class="filters">
      <label class="visually-hidden" for="startDate">Start date</label>
      <input type="date" id="startDate" />
      <label class="visually-hidden" for="endDate">End date</label>
      <input type="date" id="endDate" />
      <button id="getImagesBtn">Get Space Images</button>
    </div>

    <div id="gallery" class="gallery" aria-live="polite">
      <div class="placeholder">
        <div class="placeholder-icon">🔭</div>
        <p>Select a date range and click "Get Space Images" to explore the cosmos!</p>
      </div>
    </div>
  </div>

  <!-- Modal for showing one photo up close -->
  <dialog id="modal" class="modal" aria-labelledby="modalTitle">
    <button id="closeModal" class="close-btn" aria-label="Close">&times;</button>
    <div id="modalMedia" class="modal-media"></div>
    <div class="modal-text">
      <h2 id="modalTitle"></h2>
      <p id="modalDate" class="modal-date"></p>
      <p id="modalExplanation" class="modal-explanation"></p>
    </div>
  </dialog>

  <script src="js/dateRange.js"></script>
  <script src="js/script.js"></script>
</body>
</html>
